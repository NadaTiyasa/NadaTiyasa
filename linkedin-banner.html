<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#e9e9ed;
    font-family:"DM Sans",sans-serif;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:40px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    width:min(1584px,100%);

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:20px;
    margin-bottom:20px;
}

.toolbar-title{
    font-family:"Manrope",sans-serif;
    font-size:18px;
    font-weight:700;
    color:#321027;
}

.toolbar-subtitle{
    margin-top:4px;
    color:#6b6570;
    font-size:13px;
}

.toolbar-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.toolbar button{
    border:none;

    padding:11px 18px;

    border-radius:10px;

    background:#5b1235;
    color:#fff;

    font-family:"DM Sans",sans-serif;
    font-weight:600;

    cursor:pointer;

    transition:.2s ease;
}

.toolbar button:hover{
    transform:translateY(-1px);
    background:#75163f;
}

.toolbar button.secondary{
    background:#fff;
    color:#5b1235;
    border:1px solid #ddd7dd;
}

.toolbar button:disabled{
    opacity:.65;
    cursor:wait;
    transform:none;
}


/* =========================================================
   WRAPPER
========================================================= */

.banner-wrapper{
    width:min(1584px,100%);

    overflow:auto;

    border-radius:4px;

    box-shadow:
        0 30px 80px rgba(34,14,28,.18),
        0 8px 25px rgba(34,14,28,.08);
}


/* =========================================================
   LINKEDIN BANNER
   1584 × 396
========================================================= */

.banner{
    position:relative;

    width:1584px;
    height:396px;

    overflow:hidden;

    isolation:isolate;

    background:

        /* BIG MAGENTA/GOLD AMBIENT */
        radial-gradient(
            ellipse 520px 310px at 88% 18%,
            rgba(206,70,127,.30),
            rgba(157,41,88,.16) 35%,
            transparent 72%
        ),

        radial-gradient(
            ellipse 520px 360px at 17% 92%,
            rgba(161,44,94,.40),
            transparent 72%
        ),

        radial-gradient(
            ellipse 430px 240px at 67% 48%,
            rgba(216,164,93,.10),
            transparent 70%
        ),

        linear-gradient(
            115deg,
            #2d0b22 0%,
            #421027 28%,
            #591132 58%,
            #71153e 82%,
            #7e1945 100%
        );
}


/* =========================================================
   GLOBAL AMBIENT LIGHT
========================================================= */

.banner::before{
    content:"";

    position:absolute;

    width:760px;
    height:760px;

    right:-280px;
    top:-360px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.12) 0%,
            rgba(255,220,177,.07) 18%,
            rgba(216,164,93,.05) 32%,
            transparent 68%
        );

    filter:blur(4px);

    pointer-events:none;

    z-index:1;
}


/* =========================================================
   SECONDARY GLOW
========================================================= */

.banner::after{
    content:"";

    position:absolute;

    width:680px;
    height:360px;

    left:420px;
    top:30px;

    background:
        radial-gradient(
            ellipse,
            rgba(216,164,93,.085) 0%,
            rgba(216,164,93,.035) 35%,
            transparent 72%
        );

    filter:blur(28px);

    pointer-events:none;

    z-index:1;
}


/* =========================================================
   LIGHT BLOOM — TOP RIGHT
========================================================= */

.light-bloom{
    position:absolute;

    width:330px;
    height:330px;

    right:120px;
    top:-160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,220,170,.22) 0%,
            rgba(216,164,93,.13) 16%,
            rgba(157,41,88,.08) 38%,
            transparent 72%
        );

    filter:blur(12px);

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   GOLD LIGHT — LEFT
========================================================= */

.left-glow{
    position:absolute;

    width:390px;
    height:390px;

    left:-190px;
    top:-120px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(216,164,93,.13) 0%,
            rgba(216,164,93,.07) 22%,
            rgba(157,41,88,.05) 45%,
            transparent 72%
        );

    filter:blur(20px);

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   SOFT HORIZONTAL LIGHT
========================================================= */

.horizontal-glow{
    position:absolute;

    width:850px;
    height:170px;

    right:230px;
    top:105px;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.055),
            transparent 70%
        );

    filter:blur(20px);

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   GRID
========================================================= */

.grid{
    position:absolute;

    width:620px;
    height:330px;

    right:-80px;
    bottom:-100px;

    opacity:.11;

    background-image:

        linear-gradient(
            rgba(255,255,255,.7) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.7) 1px,
            transparent 1px
        );

    background-size:30px 30px;

    transform:
        perspective(500px)
        rotateX(55deg)
        rotateZ(-12deg);

    pointer-events:none;

    mask-image:
        linear-gradient(
            to top left,
            black,
            transparent 82%
        );

    -webkit-mask-image:
        linear-gradient(
            to top left,
            black,
            transparent 82%
        );

    z-index:3;
}


/* =========================================================
   GOLD WAVES
========================================================= */

.wave{
    position:absolute;

    pointer-events:none;

    overflow:visible;

    z-index:4;

    filter:
        drop-shadow(0 0 5px rgba(216,164,93,.55))
        drop-shadow(0 0 15px rgba(216,164,93,.22));
}

.wave-top{
    width:780px;
    height:270px;

    left:-50px;
    top:-80px;

    opacity:.72;
}

.wave-bottom{
    width:850px;
    height:290px;

    right:-60px;
    bottom:-120px;

    opacity:.70;
}


/* =========================================================
   WAVE LIGHT STREAK
========================================================= */

.wave-light{
    position:absolute;

    width:620px;
    height:1px;

    left:180px;
    top:180px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(216,164,93,.10),
            rgba(255,220,170,.75),
            rgba(216,164,93,.10),
            transparent
        );

    box-shadow:
        0 0 8px rgba(216,164,93,.65),
        0 0 22px rgba(216,164,93,.25);

    transform:rotate(-8deg);

    opacity:.7;

    pointer-events:none;

    z-index:5;
}


/* =========================================================
   GOLD DOTS
========================================================= */

.gold-dot{
    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#f1c77e;

    box-shadow:

.name{

}

========================================================= */

.underline{

    background:
        linear-gradient(

            #f0bd70,
            #d8a45d 45%,

    box-shadow:
        0 0 7px rgba(216,164,93,.75),

========================================================= */

    letter-spacing:.2px;

    line-height:1.5;

    text-shadow:
        0 2px 8px rgba(0,0,0,.18);
}


/* =========================================================
   SKILLS
========================================================= */

.skills{
    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    margin-top:17px;
}

.skill{

}


/* =========================================================
   CORNER
========================================================= */

.corner{
    position:absolute;

    right:0;
    top:0;

    width:250px;
    height:100px;

    border-left:1px solid rgba(216,164,93,.12);

    border-bottom:1px solid rgba(216,164,93,.12);

}


/* =========================================================
   LOWER RIGHT SOFT SHADOW
========================================================= */

.content::after{
    content:"";

        radial-gradient(

/* =========================================================

========================================================= */

@media(max-width:900px){

        flex-direction:column;

    }

    .banner-wrapper{
        overflow-x:auto;
    }

}

</style>

<script>

/* =========================================================
   PREVIEW
========================================================= */

function previewBanner(){

    const banner =
        document.getElementById("linkedinBanner");

    const newWindow =
        window.open("", "_blank");


    if(!newWindow){

        alert(
            "Preview diblokir browser. Izinkan pop-up lalu coba lagi."
        );

        return;
    }


    newWindow.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

            <title>
                LinkedIn Banner Preview
            </title>

            <style>

                *{
                    box-sizing:border-box;
                }

                html,
                body{

                    margin:0;

                    min-height:100%;

                    background:#111;

                }

                body{

                    min-height:100vh;

                    display:flex;

                    justify-content:center;

                    align-items:center;

                    overflow:auto;

                }

            </style>

        </head>


        <body>

            ${banner.outerHTML}

        </body>

        </html>

    `);


    newWindow.document.close();

}


/* =========================================================
   DOWNLOAD PNG
========================================================= */

async function downloadPNG(){

    const banner =
        document.getElementById("linkedinBanner");

    const button =
        event.currentTarget;

    const originalText =
        button.innerText;


    button.innerText =
        "Membuat PNG...";

    button.disabled = true;


    try{

        await document.fonts.ready;


        const canvas =
            await html2canvas(
                banner,
                {

                    width:1584,

                    height:396,

                    scale:3,

                    useCORS:true,

                    allowTaint:false,

                    backgroundColor:null,

                    logging:false,

                    imageTimeout:0,

                    removeContainer:true

                }
            );


        const link =
            document.createElement("a");


        link.download =
            "linkedin-banner-nada-tiyasa-hd.png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


    }catch(error){

        console.error(error);

        alert(
            "Gagal membuat PNG. Silakan coba lagi."
        );

    }


    button.innerText =
        originalText;

    button.disabled =
        false;

}


/* =========================================================
   DOWNLOAD JPG
========================================================= */

async function downloadJPG(){

    const banner =
        document.getElementById("linkedinBanner");

    const button =
        event.currentTarget;

    const originalText =
        button.innerText;


    button.innerText =
        "Membuat JPG...";

    button.disabled = true;


    try{

        await document.fonts.ready;


        const canvas =
            await html2canvas(
                banner,
                {

                    width:1584,

                    height:396,

                    scale:3,

                    useCORS:true,

                    allowTaint:false,

                    backgroundColor:"#321027",

                    logging:false,

                    imageTimeout:0,

                    removeContainer:true

                }
            );


        const link =
            document.createElement("a");


        link.download =
            "linkedin-banner-nada-tiyasa-hd.jpg";


        link.href =
            canvas.toDataURL(
                "image/jpeg",
                0.98
            );


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


    }catch(error){

        console.error(error);

        alert(
            "Gagal membuat JPG. Silakan coba lagi."
        );

    }


    button.innerText =
        originalText;

    button.disabled =
        false;

}

</script>

</body>
</html>
